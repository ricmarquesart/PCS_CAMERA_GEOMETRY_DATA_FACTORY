name: Phase3 Candidate B Gate C MICRO100 V2

on:
  workflow_dispatch:
  push:
    branches:
      - phase3/g101-candidate-b-drive-logging
    paths:
      - SOURCE/pcs_factory_micro100_gt.py
      - qualification/phase3/test_phase3_gate2_static.py
      - qualification/phase3/test_candidate_b_gatec_micro100_v2.py
      - qualification/phase3/aggregate_gatec_micro100_v2.py
      - qualification/phase3/fixtures/micro100_gatec_v2/**
      - .github/workflows/phase3-candidate-b-gatec-micro100-v2.yml

permissions:
  contents: read

jobs:
  linux-shards:
    name: linux-${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: '000-009', start: 0, end: 9 }
          - { label: '010-019', start: 10, end: 19 }
          - { label: '020-029', start: 20, end: 29 }
          - { label: '030-039', start: 30, end: 39 }
          - { label: '040-049', start: 40, end: 49 }
          - { label: '050-059', start: 50, end: 59 }
          - { label: '060-069', start: 60, end: 69 }
          - { label: '070-079', start: 70, end: 79 }
          - { label: '080-089', start: 80, end: 89 }
          - { label: '090-099', start: 90, end: 99 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install qualification dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile qualification harness
        run: python -m py_compile SOURCE/pcs_factory_micro100_gt.py qualification/phase3/test_phase3_gate2_static.py qualification/phase3/test_candidate_b_gatec_micro100_v2.py qualification/phase3/aggregate_gatec_micro100_v2.py
      - name: Fetch immutable main authority
        run: git fetch origin main --no-tags
      - name: Protected-surface static firewall
        run: python qualification/phase3/test_phase3_gate2_static.py
      - name: Qualify archived MICRO100 shard
        run: python qualification/phase3/test_candidate_b_gatec_micro100_v2.py --start ${{ matrix.start }} --end ${{ matrix.end }} --out gatec_shard_${{ matrix.label }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: gatec-linux-${{ matrix.label }}
          path: gatec_shard_${{ matrix.label }}.json
          if-no-files-found: error

  windows-controls:
    name: windows-rendered-and-edge-controls
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install qualification dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile qualification harness
        run: python -m py_compile SOURCE/pcs_factory_micro100_gt.py qualification/phase3/test_phase3_gate2_static.py qualification/phase3/test_candidate_b_gatec_micro100_v2.py
      - name: Fetch immutable main authority
        run: git fetch origin main --no-tags
      - name: Protected-surface static firewall
        run: python qualification/phase3/test_phase3_gate2_static.py
      - name: Qualify Windows controls
        run: python qualification/phase3/test_candidate_b_gatec_micro100_v2.py --ordinals 0,3,27,39,51,63,75,87,99 --out gatec_windows_controls.json
      - uses: actions/upload-artifact@v4
        with:
          name: gatec-windows-controls
          path: gatec_windows_controls.json
          if-no-files-found: error

  aggregate:
    name: aggregate-100-of-100
    runs-on: ubuntu-latest
    needs: [linux-shards, windows-controls]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: gatec-linux-*
          path: gatec-results
          merge-multiple: false
      - name: Aggregate exact MICRO100 result
        run: python qualification/phase3/aggregate_gatec_micro100_v2.py --input-dir gatec-results --out gatec_micro100_aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: gatec-micro100-aggregate
          path: gatec_micro100_aggregate.json
          if-no-files-found: error

  qualified-head:
    name: qualified-head
    runs-on: ubuntu-latest
    needs: aggregate
    steps:
      - uses: actions/checkout@v4
      - name: Emit immutable qualification marker
        shell: bash
        run: |
          echo "GATE_C_QUALIFIED_HEAD=$(git rev-parse HEAD)"
          echo "PHASE3_GATE_C_MICRO100_V2=PASS"
